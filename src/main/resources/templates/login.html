<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container" style="min-height: 500px; max-width: 420px; margin-top: 80px">
		<h3 class="mb-3">Đăng nhập</h3>
		<div class="mb-3">
			<label class="form-label">Email</label>
			<input type="email" class="form-control" id="email" required>
		</div>
		<div class="mb-3">
			<label class="form-label">Password</label>
			<input type="password" class="form-control" id="password" required autocomplete="on">
		</div>
		<button id="Login" type="button" class="btn btn-primary">Login</button>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="/js/mainjs.js"></script>
</body>
</html>
